[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI. The import name is `onetimesecret`.
# (`onetimesecret` on PyPI is held by an unrelated third-party package.)
name = "onetime-secret"
dynamic = ["version"]
description = "Official Python client for the Onetime Secret API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Delano Mandelbaum", email = "pypi@onetimesecret.com" }]
keywords = ["onetimesecret", "secrets", "one-time", "api", "client", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://onetimesecret.com"
Documentation = "https://api.onetimesecret.com"
Repository = "https://github.com/onetimesecret/onetimesecret-py"
Issues = "https://github.com/onetimesecret/onetimesecret-py/issues"
Changelog = "https://github.com/onetimesecret/onetimesecret-py/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.22",
  "mypy>=1.13",
  "ruff>=0.8",
]

[tool.hatch.version]
path = "src/onetimesecret/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/onetimesecret",
  "tests",
  "CHANGELOG.md",
  "LICENSE",
  "README.md",
  "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/onetimesecret"]

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "RUF",       # ruff-specific
  "PT",        # pytest style
  "TC",        # type-checking imports
  "D",         # pydocstyle
  "S",         # bandit
]
ignore = [
  "D100", "D104", "D105", "D107",  # module/package/dunder docstrings
  "D203", "D213",                  # conflicting pydocstyle rules; keep D211/D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "TC"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["respx", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
  "live: tests that hit a real Onetime Secret server (set ONETIME_LIVE=1)",
]

[tool.coverage.run]
source = ["onetimesecret"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "\\.\\.\\."]
