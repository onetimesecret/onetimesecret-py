name: Release

# Tag-driven release, following the pattern used across the Onetime Secret
# SDKs and tooling (see onetimesecret/rots):
#
#   git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z
#
#   build   -> verify tag == __version__, run checks, build sdist + wheel
#   publish -> upload to PyPI via Trusted Publishing (OIDC); no token stored
#   github  -> create the GitHub Release with generated notes and the dists
#
# Actions are pinned to commit SHAs so a moved upstream tag cannot replace
# code able to publish the package. Dependabot keeps the pins current.
# Setup and the release checklist are in docs/releasing.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Verify the tag matches onetimesecret.__version__
        run: |
          version="$(uv run --no-sync --no-project python -c \
            'import runpy; print(runpy.run_path("src/onetimesecret/_version.py")["__version__"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match onetimesecret.__version__ ($version)" >&2
            exit 1
          fi

      - name: Run checks
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest

      - name: Build
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/onetime-secret/
    permissions:
      id-token: write # mint the OIDC token PyPI verifies
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the distributions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; uploading distributions only"
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --generate-notes --verify-tag
          fi
